<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --border-color: #b4befe;
      --text-color: #cdd6f4;
    }
    
    html, body { 
      margin: 0;
      padding: 0;
      width: 320px;
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .popup-frame {
      max-height: 550px; 
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border-color);
      box-sizing: border-box;
      color: var(--text-color);
    }

    .scroll-content {
      padding: 15px 20px;
      overflow-y: auto;
      
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .setting { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
    
    input[type="color"] { border: 1px solid var(--border-color); width: 32px; height: 32px; padding: 0; cursor: pointer; border-radius: 6px; background: transparent; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    
    input[type="text"] { width: 120px; padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 6px; background: rgba(0, 0, 0, 0.15); color: var(--text-color); outline: none; font-family: inherit; }
    input[type="range"] { width: 120px; accent-color: var(--border-color); }
    
    button { width: 100%; padding: 8px; cursor: pointer; border-radius: 6px; border: 1px solid var(--border-color); background: rgba(0, 0, 0, 0.15); color: var(--text-color); font-weight: 600; transition: opacity 0.2s, background 0.2s; }
    button:hover { background: rgba(255, 255, 255, 0.1); }
    
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.5); margin: 15px 0 10px 0; }
  </style>
</head>
<body>
  <div class="popup-frame">
    <div class="scroll-content">
      <h2>Spotlight Theme</h2>
      
      <div class="section-label">Colors</div>
      <div class="setting">
        <label>Background</label>
        <input type="color" id="bgColor">
      </div>
      <div class="setting">
        <label>Border Color</label>
        <input type="color" id="borderColor">
      </div>
      <div class="setting">
        <label>Text Color</label>
        <input type="color" id="textColor">
      </div>
      <div class="setting">
        <label>Accent Color</label>
        <input type="color" id="accentColor">
      </div>

      <div class="section-label">Dimensions</div>
      <div class="setting">
        <label>Width</label>
        <input type="text" id="width" placeholder="600px">
      </div>
      <div class="setting">
        <label>Border Radius</label>
        <input type="text" id="borderRadius" placeholder="16px">
      </div>
      <div class="setting">
        <label>Border Width</label>
        <input type="text" id="borderWidth" placeholder="2px">
      </div>

      <div class="section-label">Typography & Style</div>
      <div class="setting">
        <label>Font Size</label>
        <input type="text" id="fontSize" placeholder="15px">
      </div>
      <div class="setting">
        <label>Font Family</label>
        <input type="text" id="fontFamily" placeholder="Inter, sans-serif">
      </div>
      <div class="setting">
        <label>Opacity</label>
        <input type="range" id="opacity" min="0.1" max="1" step="0.05">
      </div>
      <div class="setting">
        <label>Backdrop Blur</label>
        <input type="text" id="backdropBlur" placeholder="10px">
      </div>
      <div class="setting">
        <label>Drop Shadow</label>
        <input type="text" id="boxShadow" placeholder="0 15px 40px rgba(...)">
      </div>

      <div class="btn-row" style="margin-top: 20px;">
        <button id="toggleModeBtn">Light / Dark</button>
        <button id="resetBtn">Reset</button>
        <button id="optionsBtn">Shortcuts</button>
      </div>

      <div class="btn-row" style="margin-top: 10px; margin-bottom: 5px;">
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display: none;">
  <script src="popup.js"></script>
</body>
</html>
